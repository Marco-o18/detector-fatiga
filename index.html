<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Fatiga BLE</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background-color: #222; color: white; text-align: center; margin: 0; padding: 20px; }
        video { display: none; } 
        canvas { max-width: 100%; border: 3px solid #555; border-radius: 10px; margin-top: 15px; }
        #estado { font-size: 24px; font-weight: bold; padding: 15px; margin-top: 10px; border-radius: 5px; }
        .alerta { background-color: #ff3333; color: white; }
        .normal { background-color: #33cc33; color: white; }
        
        /* Estilos del botón Bluetooth */
        #btn-bluetooth {
            background-color: #007bff; color: white; border: none;
            padding: 15px 30px; font-size: 18px; border-radius: 8px;
            cursor: pointer; font-weight: bold; margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #btn-bluetooth.conectado { background-color: #28a745; }
    </style>
</head>
<body>

    <h2>Sistema de Fatiga Inalámbrico</h2>
    
    <button id="btn-bluetooth" onclick="conectarBluetooth()">1. Conectar con Pico W</button>

    <div id="estado" class="normal">Esperando rostro...</div>
    
    <video id="video_input" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>

    <script>
        // -----------------------------------------
        // LÓGICA DE BLUETOOTH (BLE) PROTEGIDA
        // -----------------------------------------
        let bleCharacteristic = null;

        async function conectarBluetooth() {
            try {
                const btn = document.getElementById('btn-bluetooth');
                btn.innerText = "Buscando...";

                // 1. Pedir al navegador que busque la Pico W
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Pico-Somnolencia' }],
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });

                // 2. Conectar al servidor GATT
                const server = await device.gatt.connect();

                // 3. Obtener el servicio y la característica de escritura RX
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');

                // Éxito visual
                btn.innerText = "¡Bluetooth Conectado!";
                btn.classList.add("conectado");
                console.log("Conectado con éxito a la Pico W.");

            } catch (error) {
                console.error("Error al conectar por Bluetooth: ", error);
                document.getElementById('btn-bluetooth').innerText = "Error (Reintentar)";
            }
        }

        // Función asíncrona y segura para evitar congelamientos de pantalla
        async function enviarComando(valorString) {
            if (!bleCharacteristic) return; // Si no hay conexión, ignora el envío y no congela la cámara
            
            try {
                const encoder = new TextEncoder();
                await bleCharacteristic.writeValue(encoder.encode(valorString));
                console.log("Enviado: ", valorString);
            } catch (err) {
                console.error("Error de transmisión, limpiando estado: ", err);
                
                // Si se pierde el enlace de radio, restablecemos el botón para avisar al usuario
                bleCharacteristic = null;
                const btn = document.getElementById('btn-bluetooth');
                btn.innerText = "Conexión Perdida (Reconectar)";
                btn.classList.remove("conectado");
            }
        }

        // -----------------------------------------
        // LÓGICA DE VISIÓN ARTIFICIAL (MEDIAPIPE)
        // -----------------------------------------
        const videoElement = document.getElementById('video_input');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const estadoDiv = document.getElementById('estado');

        // Configuración de umbrales
        const EAR_THRESHOLD = 0.23;
        const FRAMES_CERRADOS = 15;
        let contador_ojos_cerrados = 0;
        let estado_alarma = false;

        // Puntos de los ojos en MediaPipe
        const LEFT_EYE = [33, 160, 158, 133, 153, 144];
        const RIGHT_EYE = [362, 385, 387, 263, 373, 380];

        function distancia(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function calcular_ear(ojo_indices, landmarks) {
            const p1 = landmarks[ojo_indices[0]], p2 = landmarks[ojo_indices[1]];
            const p3 = landmarks[ojo_indices[2]], p4 = landmarks[ojo_indices[3]];
            const p5 = landmarks[ojo_indices[4]], p6 = landmarks[ojo_indices[5]];
            const horizontal = distancia(p1, p4);
            if (horizontal === 0) return 0;
            return (distancia(p2, p6) + distancia(p3, p5)) / (2.0 * horizontal);
        }

        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});

        faceMesh.setOptions({
            maxNumFaces: 1, refineLandmarks: true,
            minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
        });

        faceMesh.onResults(function(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Dibujar puntos de los ojos en el Canvas para retroalimentación visual
                canvasCtx.fillStyle = '#00FF00';
                [...LEFT_EYE, ...RIGHT_EYE].forEach(idx => {
                    const lm = landmarks[idx];
                    canvasCtx.beginPath();
                    canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, 1.5, 0, 2 * Math.PI);
                    canvasCtx.fill();
                });

                // Calcular el promedio del EAR
                const ear_izq = calcular_ear(LEFT_EYE, landmarks);
                const ear_der = calcular_ear(RIGHT_EYE, landmarks);
                const ear_promedio = (ear_izq + ear_der) / 2.0;

                // Lógica de validación temporal (Filtrado de parpadeos)
                if (ear_promedio < EAR_THRESHOLD) {
                    contador_ojos_cerrados++;
                } else {
                    contador_ojos_cerrados = 0;
                }

                // Manejo de estados de alerta y envío BLE
                if (contador_ojos_cerrados >= FRAMES_CERRADOS) {
                    estadoDiv.innerText = "¡SOMNOLENCIA DETECTADA!";
                    estadoDiv.className = "alerta";
                    
                    if (!estado_alarma) {
                        enviarComando('1'); 
                        estado_alarma = true;
                    }
                } else {
                    estadoDiv.innerText = "Estado: Alerta normal";
                    estadoDiv.className = "normal";
                    
                    if (estado_alarma) {
                        enviarComando('0'); 
                        estado_alarma = false;
                    }
                }
            } else {
                estadoDiv.innerText = "Esperando rostro...";
                estadoDiv.className = "normal";
            }
            canvasCtx.restore();
        });

        // Inicialización y arranque de la cámara nativa de la tablet
        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
